<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Card Flip</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#f0f9ff;}
.scene{width:260px;height:320px;perspective:1000px;}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s;}
.scene:hover .card{transform:rotateY(180deg);}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:10px;display:flex;justify-content:center;align-items:center;}
.front{background:#3b82f6;color:white;flex-direction:column;}
.back{background:#60a5fa;color:white;transform:rotateY(180deg);padding:1rem;text-align:center;}
</style>
</head>
<body>
<div class="scene">
  <div class="card">
    <div class="face front"><h2>Front</h2><p>Image/Title</p></div>
    <div class="face back"><p>This is the back side description text.</p></div>
  </div>
</div>
</body>
</html>
