<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Gallery</title>
<style>
body{font-family:sans-serif;background:#f9fafb;margin:0;padding:2rem;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;}
.card{background:white;border:1px solid #ddd;padding:1rem;text-align:center;transition:transform .3s;display:flex;flex-direction:column;justify-content:center;}
.card:hover{transform:scale(1.05);}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<h1>Products</h1>
<div class="grid">
  <div class="card">Product 1<br>$10</div><div class="card">Product 2<br>$15</div>
  <div class="card">Product 3<br>$20</div><div class="card">Product 4<br>$25</div>
  <div class="card">Product 5<br>$30</div><div class="card">Product 6<br>$35</div>
  <div class="card">Product 7<br>$40</div><div class="card">Product 8<br>$45</div>
</div>
</body>
</html>
