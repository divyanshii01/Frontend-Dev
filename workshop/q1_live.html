<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q1 - Live Product Search</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #results { margin-top:10px; }
    .product { display:flex; gap:10px; align-items:center; padding:6px; border-bottom:1px solid #eee; }
    .loading { font-style:italic; color: #666; }
    img { width:60px; height:60px; object-fit:cover; }
  </style>
</head>
<body>
  <h2>Live Product Search</h2>
  <input id="search" placeholder="Search products..." autocomplete="off" />
  <div id="results"></div>

  <script>
    const API = 'http://localhost:3001/products';
    let lastXHR = null;

    function renderProducts(items) {
      const $r = $('#results').empty();
      if (!items || items.length === 0) {
        $r.text('No products found');
        return;
      }
      items.forEach(p => {
        const el = $(`
          <div class="product">
            <img src="${p.image}" alt="${p.name}" />
            <div>
              <div><strong>${p.name}</strong></div>
              <div>₹ ${p.price}</div>
            </div>
          </div>
        `);
        $r.append(el);
      });
    }

    $('#search').on('input', function() {
      const q = $(this).val().trim();
      $('#results').html('<div class="loading">Loading…</div>');
      // Cancel previous request if running
      if (lastXHR && lastXHR.readyState !== 4) lastXHR.abort();

      lastXHR = $.ajax({
        url: API,
        method: 'GET',
        data: { q: q },
        success: function(data) {
          renderProducts(data);
        },
        error: function(xhr, status) {
          if (status !== 'abort') $('#results').text('Error loading results');
        }
      });
    });

    // Optionally: load all at start
    $(function(){ $('#search').trigger('input'); });
  </script>
</body>
</html>
