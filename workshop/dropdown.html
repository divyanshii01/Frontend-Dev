<!DOCTYPE html>
<html>
<head><title>Dropdown Selection</title></head>
<body>
  <h1>Choose Your Travel Preferences</h1>

  Country:
  <select>
    <option selected>India</option>
    <option>Japan</option>
    <option>France</option>
  </select><br><br>

  State:
  <select>
    <option selected>Uttar Pradesh</option>
    <option>Delhi</option>
    <option>Maharashtra</option>
  </select><br><br>

  City:
  <select>
    <option selected>Mathura</option>
    <option>Lucknow</option>
  </select><br><br>

  Favorite Place:
  <select>
    <option selected>Taj Mahal</option>
    <option>Varanasi Ghat</option>
  </select><br><br>

  <p>You have selected India → Uttar Pradesh → Mathura → Taj Mahal.</p>
</body>
</html>
