<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Photo Gallery</title>
<style>
body{margin:0;font-family:sans-serif;padding:1rem;}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;}
figure{margin:0;overflow:hidden;}
img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
figure:hover img{transform:scale(1.1);}
figcaption{text-align:center;padding:.5rem;}
</style>
</head>
<body>
<div class="gallery">
  <figure><img src="https://picsum.photos/300/200?1"><figcaption>Image 1</figcaption></figure>
  <figure><img src="https://picsum.photos/300/200?2"><figcaption>Image 2</figcaption></figure>
  <figure><img src="https://picsum.photos/300/200?3"><figcaption>Image 3</figcaption></figure>
  <figure><img src="https://picsum.photos/300/200?4"><figcaption>Image 4</figcaption></figure>
</div>
</body>
</html>
