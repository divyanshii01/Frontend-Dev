<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>
    <h2>Google Map of Mathura</h2>
    <!-- loading="lazy" delays loading the map until it's visible on screen -->
    <iframe 
        src="https://www.google.com/maps?q=Mathura&output=embed" 
        width="80%" height="450" 
        title="Map of Mathura" 
        loading="lazy">
    </iframe>
</body>
</html>
