<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio — Your Name</title>
<style>
  :root{--bg:#0f1724;--card:#0b1220;--accent:#ffd166;--text:#e6eef8}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;color:var(--text);background:linear-gradient(180deg,#071021 0%, #0b1b2b 100%);}
  header{position:fixed;top:0;left:0;right:0;background:rgba(7,17,33,0.9);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid rgba(255,255,255,0.04);z-index:50}
  header h1{margin:0;font-size:1.25rem}
  nav a{color:var(--text);margin-left:1rem;text-decoration:none;font-size:0.95rem}
  main{padding-top:5.5rem; /* space for fixed header */ max-width:900px;margin:2rem auto}
  .bio{display:flex;gap:1.5rem;align-items:center;background:var(--card);padding:1.25rem;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
  .bio img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--accent)}
  .bio p{margin:0;font-size:1rem;line-height:1.5}
  footer{position:fixed;left:0;right:0;bottom:0;background:#08121a;color:#bcd5ea;display:flex;justify-content:center;padding:0.75rem 1rem;border-top:1px solid rgba(255,255,255,0.03)}
  /* use different units */
  .bio p{font-size:1rem /* 1rem */; max-width:60ch}
  h1{font-size:1.25rem /* px implied by default */;}
  @media(min-width:900px){
    main{padding:3vh 0}
  }
  @media(max-width:520px){
    .bio{flex-direction:column;text-align:center}
    .bio img{width:10rem;height:10rem}
  }
</style>
</head>
<body>
  <header>
    <h1>Your Name</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="bio" id="about">
      <img src="https://via.placeholder.com/240" alt="Profile image">
      <div>
        <h2 style="margin:0 0 .5rem 0;color:var(--accent)">Short Bio</h2>
        <p>Hi — I'm a web developer from India who loves building accessible, responsive sites.
           I focus on semantic HTML, modern CSS, and clear UX. This demo uses px, rem, em, %, and vh units.</p>
      </div>
    </section>

    <section style="margin-top:2rem;background:rgba(11,18,28,0.7);padding:1rem;border-radius:10px;">
      <h3 id="contact">Contact</h3>
      <p>Email: you@example.com</p>
    </section>
  </main>

  <footer>© <span id="year"></span> Your Name — Built with HTML & CSS</footer>

<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
